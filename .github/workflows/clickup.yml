name: ClickUp

on:
  create:
  push:
    branches-ignore: [main, develop]
  pull_request:
    types: [opened, reopened, ready_for_review, review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  clickup:
    uses: moozo-org/.github/.github/workflows/clickup-sync.yml@main
    secrets:
      CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
